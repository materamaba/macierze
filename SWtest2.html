    const quizContainer = document.getElementById('quiz');
    const resultsContainer = document.getElementById('results');
    const submitButton = document.getElementById('submit');
    
    let currentQuizQuestions = [];

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function buildQuiz() {
        currentQuizQuestions = shuffle([...allQuestions]).slice(0, 10);
        
        const output = [];

        currentQuizQuestions.forEach((currentQuestion, questionNumber) => {
            const answers = [];
            for (letter in currentQuestion.answers) {
                answers.push(
                    `<label id="label-${questionNumber}-${letter}">
                        <input type="checkbox" name="question${questionNumber}" value="${letter}">
                        <strong>${letter.toUpperCase()})</strong> ${currentQuestion.answers[letter]}
                    </label>`
                );
            }
            output.push(
                `<div class="question-block">
                    <div class="question-title">${questionNumber + 1}. ${currentQuestion.question}</div>
                    <div class="options">${answers.join('')}</div>
                    <div class="explanation" id="expl-${questionNumber}"><strong>Wyjaśnienie:</strong> ${currentQuestion.explanation || 'Brak'}</div>
                </div>`
            );
        });

        quizContainer.innerHTML = output.join('');
    }

    function showResults() {
        const answerContainers = quizContainer.querySelectorAll('.options');
        let numCorrect = 0;

        currentQuizQuestions.forEach((currentQuestion, questionNumber) => {
            const answerContainer = answerContainers[questionNumber];
            const selector = `input[name=question${questionNumber}]:checked`;
            const checkedInputs = answerContainer.querySelectorAll(selector);
            
            const userAnswers = Array.from(checkedInputs).map(input => input.value);
            const correctAnswers = currentQuestion.correctAnswers;

            for (letter in currentQuestion.answers) {
                const lbl = document.getElementById(`label-${questionNumber}-${letter}`);
                lbl.classList.remove('correct', 'incorrect');
                document.querySelector(`input[name=question${questionNumber}][value="${letter}"]`).disabled = true;
            }

            const isFullyCorrect = (userAnswers.length === correctAnswers.length) && 
                                   userAnswers.every(val => correctAnswers.includes(val));

            if (isFullyCorrect) {
                numCorrect++;
            }

            userAnswers.forEach(ans => {
                const lbl = document.getElementById(`label-${questionNumber}-${ans}`);
                if (correctAnswers.includes(ans)) {
                    lbl.classList.add('correct');
                } else {
                    lbl.classList.add('incorrect');
                }
            });

            correctAnswers.forEach(ans => {
                if (!userAnswers.includes(ans)) {
                    document.getElementById(`label-${questionNumber}-${ans}`).classList.add('correct');
                }
            });

            const expl = document.getElementById(`expl-${questionNumber}`);
            if(expl) {
                expl.style.display = 'block';
            }
        });

        resultsContainer.innerHTML = `Twój wynik: <span style="color: ${numCorrect >= 5 ? '#27ae60' : '#c0392b'};">${numCorrect} z ${currentQuizQuestions.length}</span> (Musiałeś/aś zaznaczyć wszystkie warianty dla danego pytania!)`;
        
        submitButton.disabled = true;
        submitButton.style.backgroundColor = '#95a5a6';
        submitButton.innerText = 'Sprawdzono';
    }

    buildQuiz();
    submitButton.addEventListener('click', showResults);
</script>

</body>
</html>
