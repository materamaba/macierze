    let currentQuizQuestions = [];

    // Funkcja do losowania pytań
    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // Inicjalizacja quizu
    function initQuiz() {
        // Losuj maksymalnie 10 pytań
        const shuffled = shuffleArray([...allQuestions]);
        currentQuizQuestions = shuffled.slice(0, 10);

        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        currentQuizQuestions.forEach((q, index) => {
            let html = `<div class="question-card" id="question-card-${index}">
                            <div class="question-title">${index + 1}. ${q.question}</div>`;
            
            if (q.image) {
                html += `<img src="${q.image}" class="question-image" alt="Obrazek do pytania">`;
            }

            if (q.type === 'single') {
                q.options.forEach(opt => {
                    html += `<label class="option">
                                <input type="radio" name="q${index}" value="${opt}"> ${opt}
                             </label>`;
                });
            } else if (q.type === 'multiple') {
                q.options.forEach(opt => {
                    html += `<label class="option">
                                <input type="checkbox" name="q${index}" value="${opt}"> ${opt}
                             </label>`;
                });
            } else if (q.type === 'open') {
                html += `<input type="text" class="open-input" name="q${index}" placeholder="Wpisz odpowiedź...">`;
            }

            html += `</div>`;
            container.innerHTML += html;
        });
    }

    // Sprawdzanie odpowiedzi
    function checkAnswers() {
        let score = 0;
        const resultsContainer = document.getElementById('results-details');
        resultsContainer.innerHTML = '';

        currentQuizQuestions.forEach((q, index) => {
            let userAnswer = null;
            let isCorrect = false;

            // Pobieranie odpowiedzi użytkownika i sprawdzanie poprawności
            if (q.type === 'single') {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                userAnswer = selected ? selected.value : "Brak odpowiedzi";
                isCorrect = (userAnswer === q.correctAnswer);
            } 
            else if (q.type === 'multiple') {
                const checkedNodes = document.querySelectorAll(`input[name="q${index}"]:checked`);
                userAnswer = Array.from(checkedNodes).map(node => node.value);
                
                // Porównywanie tablic dla wielokrotnego wyboru
                if (userAnswer.length === 0) {
                    userAnswer = "Brak odpowiedzi";
                } else {
                    const isLengthSame = userAnswer.length === q.correctAnswer.length;
                    const hasAllElements = q.correctAnswer.every(val => userAnswer.includes(val));
                    isCorrect = isLengthSame && hasAllElements;
                }
            } 
            else if (q.type === 'open') {
                const inputVal = document.querySelector(`input[name="q${index}"]`).value.trim();
                userAnswer = inputVal !== "" ? inputVal : "Brak odpowiedzi";
                // Tolerancja dla małych/wielkich liter
                isCorrect = (userAnswer.toLowerCase() === q.correctAnswer.toLowerCase()); 
            }

            if (isCorrect) score++;

            // Generowanie podsumowania dla danego pytania
            const statusClass = isCorrect ? 'correct' : 'incorrect';
            const statusText = isCorrect ? 'Dobrze!' : 'Błąd!';
            
            let displayUserAnswer = Array.isArray(userAnswer) ? userAnswer.join(', ') : userAnswer;
            let displayCorrectAnswer = Array.isArray(q.correctAnswer) ? q.correctAnswer.join(', ') : q.correctAnswer;

            let resultHtml = `
                <div class="result-card ${statusClass}">
                    <strong>${index + 1}. ${q.question}</strong><br>
                    <span style="display:inline-block; margin-top:5px;">Wynik: ${statusText}</span>
                    <div class="result-details">
                        Twoja odpowiedź: <span class="${isCorrect ? 'correct-answer-text' : 'user-answer-text'}">${displayUserAnswer}</span><br>
                        ${!isCorrect ? `Poprawna odpowiedź: <span class="correct-answer-text">${displayCorrectAnswer}</span>` : ''}
                    </div>
                </div>
            `;
            resultsContainer.innerHTML += resultHtml;
        });

        // Ukrycie quizu i pokazanie wyników
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('results-container').style.display = 'block';
        document.getElementById('score-display').innerText = `Twój wynik: ${score} / ${currentQuizQuestions.length}`;
        window.scrollTo(0, 0);
    }

    // Uruchom na starcie
    window.onload = initQuiz;
