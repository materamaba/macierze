            border: none;

        .btn:hover {

    let currentQuizQuestions = [];

    // Inicjalizacja: Wrzucamy WSZYSTKIE pytania z bazy
    function initQuiz() {
        // Kopiujemy wszystkie pytania (nie ucinamy do 10)
        currentQuizQuestions = [...allQuestions];

        // Wyświetlenie licznika pytań na górze strony
        document.getElementById('quiz-count-info').innerText = `Liczba pytań w bazie: ${currentQuizQuestions.length}`;

        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        currentQuizQuestions.forEach((q, index) => {
            let html = `<div class="question-card" id="question-card-${index}">
                            <div class="question-title">${index + 1}. [ID: ${q.id}] ${q.question}</div>`;

            if (q.type === 'single') {
                q.options.forEach(opt => {
                    html += `<label class="option">
                                <input type="radio" name="q${index}" value="${opt}"> ${opt}
                             </label>`;
                });
            } else if (q.type === 'multiple') {
                q.options.forEach(opt => {
                    html += `<label class="option">
                                <input type="checkbox" name="q${index}" value="${opt}"> ${opt}
                             </label>`;
                });
            } else if (q.type === 'open') {
                html += `<input type="text" class="open-input" name="q${index}" placeholder="Wpisz odpowiedź...">`;
            }

            html += `</div>`;
            container.innerHTML += html;
        });
    }

    // Inteligentne sprawdzanie odpowiedzi dla pełnego testu
    function checkAnswers() {
        let score = 0;
        let maxPossibleScore = currentQuizQuestions.length;
        const resultsContainer = document.getElementById('results-details');
        resultsContainer.innerHTML = '';

        currentQuizQuestions.forEach((q, index) => {
            let userAnswer = null;
            let isCorrect = false;
            let isDescriptive = false; // flaga dla długich opisówek

            if (q.type === 'single') {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                userAnswer = selected ? selected.value : "Brak odpowiedzi";
                isCorrect = (userAnswer === q.correctAnswer);
            } 
            else if (q.type === 'multiple') {
                const checkedNodes = document.querySelectorAll(`input[name="q${index}"]:checked`);
                userAnswer = Array.from(checkedNodes).map(node => node.value);
                
                if (userAnswer.length === 0) {
                    userAnswer = "Brak odpowiedzi";
                } else {
                    const isLengthSame = userAnswer.length === q.correctAnswer.length;
                    const hasAllElements = q.correctAnswer.every(val => userAnswer.includes(val));
                    isCorrect = isLengthSame && hasAllElements;
                }
            } 
            else if (q.type === 'open') {
                const inputVal = document.querySelector(`input[name="q${index}"]`).value.trim();
                userAnswer = inputVal !== "" ? inputVal : "Brak odpowiedzi";
                
                // Jeśli odpowiedź wzorcowa ma więcej niż 25 znaków, traktujemy jako długą opisówkę
                if (q.correctAnswer.length > 25) {
                    isDescriptive = true;
                } else {
                    isCorrect = (userAnswer.toLowerCase() === q.correctAnswer.toLowerCase());
                }
            }

            if (isCorrect) score++;
            if (isDescriptive) maxPossibleScore--; // Wykluczamy z automatycznego licznika punktów

            // Dobór stylu i komunikatów dla Dark Mode
            let statusClass = isCorrect ? 'correct' : 'incorrect';
            let statusText = isCorrect ? 'Dobrze!' : 'Błąd!';
            
            if (isDescriptive) {
                statusClass = 'correct'; 
                statusText = 'Pytanie opisowe (porównaj ze wzorcem)';
            }
            
            let displayUserAnswer = Array.isArray(userAnswer) ? userAnswer.join(', ') : userAnswer;
            let displayCorrectAnswer = Array.isArray(q.correctAnswer) ? q.correctAnswer.join(', ') : q.correctAnswer;

            let resultHtml = `
                <div class="result-card ${statusClass}">
                    <strong>${index + 1}. ${q.question}</strong><br>
                    <span style="display:inline-block; margin-top:5px; font-weight:bold;">Status: ${statusText}</span>
                    <div class="result-details">
                        Twoja odpowiedź: <span class="${isCorrect ? 'correct-answer-text' : 'user-answer-text'}">${displayUserAnswer}</span><br>
                        ${(!isCorrect || isDescriptive) ? `Sugerowana odpowiedź wzorcowa: <span class="correct-answer-text">${displayCorrectAnswer}</span>` : ''}
                    </div>
                </div>
            `;
            resultsContainer.innerHTML += resultHtml;
        });

        // Ukrycie quizu i pokazanie wyników
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('quiz-count-info').style.display = 'none';
        document.getElementById('results-container').style.display = 'block';
        document.getElementById('score-display').innerText = `Twój wynik testu: ${score} / ${maxPossibleScore} pkt`;
        window.scrollTo(0, 0);
    }

    // Start na załadowanie witryny
    window.onload = initQuiz;
